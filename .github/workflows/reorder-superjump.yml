name: Reordenar Super Salto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorder-superjump.yml'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Separar bloques Súper Salto
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "if (JUMP_SEGMENTS.filter(item => item === 'Súper Salto').length < 2) {\n        JUMP_SEGMENTS.push('Súper Salto');\n      }"
          new = "JUMP_SEGMENTS.splice(\n        0,\n        JUMP_SEGMENTS.length,\n        'Súper Salto', 'Adivina', 'Mímica', 'Dibuja',\n        'Súper Salto', 'Pregunta', 'Flash Win', 'Adivina'\n      );"
          if old not in text:
              raise SystemExit('No se encontró el bloque esperado en index.html')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit y push
        run: |
          git config user.name "cmstecnologia86-ops"
          git config user.email "cmstecnologia86@gmail.com"
          git add index.html
          git commit -m "Separar los dos bloques Súper Salto en posiciones opuestas"
          git push
